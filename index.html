<!DOCTYPE html>
<html>
<head>
    <title>JustSpin Bangalore</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<div class="wrap">
  <div class="logo-wrap">
    <div class="logo">
      <span class="just">Just</span>
      <div class="spin-wrap">
        <div class="s-box">
          <div class="s-bg"></div>
          <span class="s-letter">S</span>
        </div>
        <span>pin</span>
      </div>
    </div>
  </div>
  <p class="tagline">Can't decide? Let fate do it</p>

  <div class="section">
    <div class="sec-label">City</div>
    <div class="city-row">
      <div class="city-chip active" data-filter="city" data-val="bengaluru">🏙️ Bengaluru</div>
      <div class="city-chip locked">🔒 Mumbai <span class="soon">Soon</span></div>
      <div class="city-chip locked">🔒 Hyderabad <span class="soon">Soon</span></div>
      <div class="city-chip locked">🔒 Chennai <span class="soon">Soon</span></div>
    </div>
  </div>

  <div class="section">
    <div class="sec-label">Pick your area</div>
    <div class="select-wrap">
      <select class="area-select" id="area">
        <option value="">Anywhere in Bangalore</option>
        <option>Whitefield</option>
        <option>Brookefield</option>
        <option>Marathahalli</option>
        <option>Bellandur</option>
        <option>Indiranagar</option>
      </select>
    </div>
  </div>

  <div class="section">
    <div class="sec-label">What's the vibe?</div>
    <div class="vibe-grid">
      <div class="vibe-chip" data-val="Pub" data-filter="category">🍺 Pub</div>
      <div class="vibe-chip" data-val="Restaurant" data-filter="category">🍽️ Restaurant</div>
      <div class="vibe-chip" data-val="Park" data-filter="category">🌿 Park</div>
      <div class="vibe-chip" data-val="Long Drive" data-filter="category">🚗 Long Drive</div>
      <div class="vibe-chip" data-val="Date Place" data-filter="category">💕 Date Place</div>
      <div class="vibe-chip" data-val="Outdoor Activity" data-filter="category">🏕️ Outdoor Activity</div>
      <div class="vibe-chip" data-val="Zany" data-filter="category">
    🤪 Zany
</div>
    </div>
  </div>

  <div class="section">
    <div class="sec-label">Budget</div>
    <div class="budget-row">
      <div class="b-chip active" data-val="any" data-filter="budget">Any Budget</div>
      <div class="b-chip" data-val="under500" data-filter="budget">Under ₹500</div>
      <div class="b-chip" data-val="500to1500" data-filter="budget">₹500 – ₹1500</div>
      <div class="b-chip" data-val="1500plus" data-filter="budget">₹1500+</div>
    </div>
  </div>

  <button id="spinBtn" onclick="handleSpin()">🎲 SPIN THE WHEEL</button>

  <div class="result-box" id="result"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

</body>
</html>
